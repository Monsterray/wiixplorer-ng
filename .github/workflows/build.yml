name: Build and regression checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: python3 tests/archives.py
      - run: sudo apt-get update && sudo apt-get install -y pkg-config libjpeg-dev zlib1g-dev
      - run: |
          for test in tpl_bounds gif_bounds audio_ring audio_decode movie_frames texture_stride video_codec font_glyph pdf_raster font_io image_lifetime image_publication browser_storage memory_probes memory_bench; do
            python3 "tests/$test.py"
          done
      - run: python3 tests/archive_fs.py
      - run: python3 tests/regression.py
      - run: python3 tests/stability.py
      - run: python3 tests/dolphin_process.py
      - run: python3 tests/diagnose.py
      - run: python3 tests/validate_bench.py
      - run: python3 tests/wii_capture_build.py
      - run: python3 tests/package.py
      - run: python3 tests/feature_io.py
      - run: python3 tests/md5_file.py
      - run: python3 tests/probes.py
      - run: python3 tests/hbc_agent.py
      - run: python3 tests/hbc_smoke.py
      - run: git diff --check
  wii-build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc:latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Record SDK packages
        run: dkp-pacman -Q
      - run: make deps
      - run: make -j2 release
      - run: make -j2 debug
      - uses: actions/upload-artifact@v7
        with:
          name: wiixplorer-development
          if-no-files-found: error
          path: |
            build/release/boot.*
            build/debug/boot.*
            build/debug/build-info.json
            build/release/build-info.json
            build/debug/probe-config.h
            build/release/probe-config.h
            release/wiixplorer/**
            release/wiixplorer-debug/**
